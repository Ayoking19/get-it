<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get It - Dashboard</title>
  
  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // THE FIX: Flip this to false once the real backend exists. Every Api function below will then call the real
    // endpoint instead of its mock branch — nothing outside this Api object needs to change
    const USE_MOCK_DATA = true;
    const API_BASE = 'https://getit.socialappwebsite.me/api';

    const mockDelay = (ms = 500) => new Promise((resolve) => setTimeout(resolve, ms));

    const ALL_CLASSIFICATIONS = [
      'Furniture', 'Mechanical Engineering', 'Electrical Engineering', 'Cook', 'Plumbing',
      'Entertainment', 'Electronic Devices', 'Health Expert', 'Gym', 'Graphic Design',
      'Web Development', 'Photography', 'Tutoring', 'Event Planning', 'Beauty & Salon',
      'Auto Repair', 'Tailoring', 'Cleaning Services', 'Painting', 'Food', 'Clothing',
      'Electronics', 'Cars', 'Houses', 'Watches', 'Cooking Utensils', 'Transport',
      'Books', 'Jewelry', 'Sports Equipment', 'Beauty Products', 'Toys', 'Appliances'
    ].sort();

    const shuffleArray = (array) => {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    // THE FIX: Read-only reference data — nobody edits their distance or delivery fee from the frontend, so these
    // stay as plain constants, served as-is by Api.getNearbyServices() / Api.getDeliveries() below
    const mockNearbyServices = [
      { id: 1, providerName: 'Adaeze Okafor', category: 'Plumbing Repair', rating: 4.9, price: '₦8,500', distance: '1.2km away', 
        icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="#94a3b8"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg> 
      },
      { id: 2, providerName: 'Chidi Emeka', category: 'AC Installation', rating: 4.7, price: '₦25,000', distance: '2.4km away', 
        icon: (
          <svg width="24" height="24" viewBox="0 0 24 24" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <line x1="5" y1="5" x2="19" y2="19" />
            <line x1="5" y1="19" x2="19" y2="5" />
            <polyline points="15 5 12 8 9 5" fill="none" />
            <polyline points="15 19 12 16 9 19" fill="none" />
            <polyline points="5 9 8 12 5 15" fill="none" />
            <polyline points="19 9 16 12 19 15" fill="none" />
          </svg>
        )
      },
      { id: 3, providerName: 'Fatima Sule', category: 'House Cleaning', rating: 5.0, price: '₦6,000', distance: '0.8km away', 
        icon: (
          <svg width="24" height="24" viewBox="0 0 24 24">
            <line x1="19" y1="5" x2="11" y2="13" stroke="#d97706" strokeWidth="3" strokeLinecap="round" />
            <path d="M12 12 L5 21 C 4.5 21.8 5 23 6 23 L16 23 C 17 23 17.5 21.8 17 21 L12 12 Z" fill="#d97706" />
            <line x1="8" y1="23" x2="9" y2="18" stroke="#ffffff" strokeOpacity="0.3" strokeWidth="1.5" strokeLinecap="round" />
            <line x1="11" y1="23" x2="11" y2="17" stroke="#ffffff" strokeOpacity="0.3" strokeWidth="1.5" strokeLinecap="round" />
            <line x1="14" y1="23" x2="13" y2="18" stroke="#ffffff" strokeOpacity="0.3" strokeWidth="1.5" strokeLinecap="round" />
          </svg>
        )
      },
      { id: 4, providerName: 'Tunde Bakare', category: 'Electrical Wiring', rating: 4.8, price: '₦12,000', distance: '3.1km away', 
        icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="#facc15"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg> 
      },
      { id: 5, providerName: 'Ngozi Umeh', category: 'Furniture Assembly', rating: 4.6, price: '₦7,500', distance: '1.9km away', 
        icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="#b45309"><path d="M4 18v3h3v-3h10v3h3v-6H4v3zm15-8h3v3h-3v-3zM2 10h3v3H2v-3zm15 3H7V5c0-1.1.9-2 2-2h6c1.1 0 2 .9 2 2v8z"/></svg> 
      },
      { id: 6, providerName: 'Emeka Obi', category: 'Painting Services', rating: 4.9, price: '₦18,000', distance: '2.7km away', 
        icon: <svg width="24" height="24" viewBox="0 0 24 24" fill="#ec4899"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.2-.64-1.67-.08-.09-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4 11 4.67 11 5.5 10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4 16 4.67 16 5.5 15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8 19 8.67 19 9.5 18.33 11 17.5 11z"/></svg> 
      }
    ];

    const mockDeliveries = [
      { id: 1, pickup: 'Ikeja City Mall', dropoff: 'Magodo Phase 2', fee: '₦2,200', distance: '6.4km', status: 'Available' },
      { id: 2, pickup: 'Computer Village', dropoff: 'Yaba Tech Hub', fee: '₦1,500', distance: '3.1km', status: 'Available' },
      { id: 3, pickup: 'Lekki Phase 1', dropoff: 'Victoria Island', fee: '₦2,800', distance: '7.9km', status: 'Available' }
    ];

    // THE FIX: This object simulates the "backend + database" combined, entirely in mock mode. It lives in module
    // scope (outside the component) so it persists for the whole page session, the same way a real database would
    // persist between requests — this is the ONLY section that gets deleted once the real backend exists
    let mockDb = {
      listings: [
        { id: 1, title: 'Professional Plumbing Repair', price: '₦8,500', views: 142, status: 'Active', classification: 'Plumbing' },
        { id: 2, title: 'Emergency Pipe Fitting', price: '₦15,000', views: 87, status: 'Active', classification: 'Plumbing' },
        { id: 3, title: 'Water Heater Installation', price: '₦22,000', views: 34, status: 'Paused', classification: 'Plumbing' }
      ],
      buyerRequests: [
        { id: 101, title: 'Need a plumber to fix a leaking kitchen sink', classification: 'Plumbing', budget: '₦7,000', postedBy: 'Kunle A.' },
        { id: 102, title: 'Looking for someone to assemble 2 wardrobes', classification: 'Furniture', budget: '₦6,000', postedBy: 'Ifeoma N.' },
        { id: 103, title: 'Need a graphic designer for a logo redesign', classification: 'Graphic Design', budget: '₦20,000', postedBy: 'Segun O.' },
        { id: 104, title: 'Looking for a caterer for a small event', classification: 'Cook', budget: '₦30,000', postedBy: 'Ada E.' }
      ],
      notifications: [
        { id: 1, text: 'Adaeze Okafor accepted your service request', time: '10 minutes ago' },
        { id: 2, text: 'New message from Chidi Emeka', time: '1 hour ago' },
        { id: 3, text: 'Your plumbing request was seen by 2 providers nearby', time: '2 hours ago' }
      ],
      requests: []
    };

    // THE FIX: The API layer. Every function returns a Promise with the exact same shape whether in mock mode or
    // hitting a real endpoint. Components below only ever call these — never localStorage or a mock array directly
    const Api = {
      getCurrentUser: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay(300);
          const stored = localStorage.getItem('currentUser');
          if (!stored) throw new Error('Not logged in');
          return JSON.parse(stored);
        }
        const res = await fetch(`${API_BASE}/me`, { credentials: 'include' });
        if (!res.ok) throw new Error('Not logged in');
        return res.json();
      },

      logout: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay(150);
          localStorage.removeItem('currentUser');
          return;
        }
        await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
      },

      getNearbyServices: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return mockNearbyServices;
        }
        const res = await fetch(`${API_BASE}/services`, { credentials: 'include' });
        return res.json();
      },

      getDeliveries: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return mockDeliveries;
        }
        const res = await fetch(`${API_BASE}/deliveries`, { credentials: 'include' });
        return res.json();
      },

      getListings: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return mockDb.listings;
        }
        const res = await fetch(`${API_BASE}/listings`, { credentials: 'include' });
        return res.json();
      },

      updateListing: async (id, changes) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          mockDb.listings = mockDb.listings.map((item) => (item.id === id ? { ...item, ...changes } : item));
          return mockDb.listings.find((item) => item.id === id);
        }
        const res = await fetch(`${API_BASE}/listings/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(changes)
        });
        if (!res.ok) throw new Error('Update failed');
        return res.json();
      },

      deleteListing: async (id) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          mockDb.listings = mockDb.listings.filter((item) => item.id !== id);
          return;
        }
        const res = await fetch(`${API_BASE}/listings/${id}`, { method: 'DELETE', credentials: 'include' });
        if (!res.ok) throw new Error('Delete failed');
      },

      getMatchingRequests: async (classifications) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return shuffleArray(mockDb.buyerRequests).filter((req) => classifications.includes(req.classification));
        }
        const query = classifications.map((c) => `classifications[]=${encodeURIComponent(c)}`).join('&');
        const res = await fetch(`${API_BASE}/requests/matching?${query}`, { credentials: 'include' });
        return res.json();
      },

      getMyRequests: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return mockDb.requests;
        }
        const res = await fetch(`${API_BASE}/requests/mine`, { credentials: 'include' });
        return res.json();
      },

      sendRequest: async (service) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          const newRequest = { id: Date.now(), sourceId: service.id, title: service.category, provider: service.providerName, status: 'waiting' };
          mockDb.requests = [...mockDb.requests, newRequest];
          return newRequest;
        }
        const res = await fetch(`${API_BASE}/requests`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ listingId: service.id })
        });
        if (!res.ok) throw new Error('Request failed');
        return res.json();
      },

      // THE FIX: In mock mode this simulates the OTHER party approving. Once the real backend exists, this
      // function is called from THEIR account, not the Buyer's — nothing about calling it from here changes
      updateRequestStatus: async (id, status) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          mockDb.requests = mockDb.requests.map((req) => (req.id === id ? { ...req, status } : req));
          return mockDb.requests.find((req) => req.id === id);
        }
        const res = await fetch(`${API_BASE}/requests/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error('Update failed');
        return res.json();
      },

      endRequest: async (id) => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          mockDb.requests = mockDb.requests.filter((req) => req.id !== id);
          return;
        }
        const res = await fetch(`${API_BASE}/requests/${id}`, { method: 'DELETE', credentials: 'include' });
        if (!res.ok) throw new Error('Update failed');
      },

      getNotifications: async () => {
        if (USE_MOCK_DATA) {
          await mockDelay();
          return mockDb.notifications;
        }
        const res = await fetch(`${API_BASE}/notifications`, { credentials: 'include' });
        return res.json();
      }
    };

    const Dashboard = () => {
      const [currentUser, setCurrentUser] = useState(null);
      const [isLoadingPage, setIsLoadingPage] = useState(true);

      const [listings, setListings] = useState([]);
      const [nearbyServices, setNearbyServices] = useState([]);
      const [matchingRequests, setMatchingRequests] = useState([]);
      const [deliveries, setDeliveries] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [myRequests, setMyRequests] = useState([]);

      const [editingListingId, setEditingListingId] = useState(null);
      const [editDraft, setEditDraft] = useState({ title: '', classification: '' });

      // THE FIX: Runs once on mount. First fetches the logged-in user; if that fails (no valid session), it
      // redirects to index.html — this IS the new route guard, replacing the old direct Local Storage check.
      // If it succeeds, Promise.all fetches every piece of role-relevant content AT THE SAME TIME rather than
      // one after another, so the page loads as fast as possible instead of waiting on each request in sequence
      useEffect(() => {
        const loadDashboard = async () => {
          try {
            const user = await Api.getCurrentUser();
            setCurrentUser(user);

            if (user.role === 'buyer') {
              const [services, myReqs, notifs] = await Promise.all([
                Api.getNearbyServices(),
                Api.getMyRequests(),
                Api.getNotifications()
              ]);
              setNearbyServices(services);
              setMyRequests(myReqs);
              setNotifications(notifs);
            } else if (user.role === 'seller') {
              const [ownListings, matching, notifs] = await Promise.all([
                Api.getListings(),
                Api.getMatchingRequests(user.classifications || []),
                Api.getNotifications()
              ]);
              setListings(ownListings);
              setMatchingRequests(matching);
              setNotifications(notifs);
            } else if (user.role === 'courier') {
              const [jobs, notifs] = await Promise.all([
                Api.getDeliveries(),
                Api.getNotifications()
              ]);
              setDeliveries(jobs);
              setNotifications(notifs);
            }
          } catch (error) {
            window.location.href = "index.html";
            return;
          } finally {
            setIsLoadingPage(false);
          }
        };

        loadDashboard();
      }, []);

      const handleLogout = async () => {
        await Api.logout();
        window.location.href = "index.html";
      };

      const handleStartEdit = (listing) => {
        setEditingListingId(listing.id);
        setEditDraft({ title: listing.title, classification: listing.classification });
      };

      const handleSaveEdit = async (id) => {
        try {
          const updated = await Api.updateListing(id, editDraft);
          setListings((prev) => prev.map((item) => (item.id === id ? updated : item)));
          setEditingListingId(null);
        } catch (error) {
          alert('Could not save changes. Please try again.');
        }
      };

      const handleCancelEdit = () => {
        setEditingListingId(null);
      };

      const handleDeleteListing = async (id) => {
        try {
          await Api.deleteListing(id);
          setListings((prev) => prev.filter((item) => item.id !== id));
        } catch (error) {
          alert('Could not delete this listing. Please try again.');
        }
      };

      const handleSendRequest = async (service) => {
        const alreadyRequested = myRequests.some((req) => req.sourceId === service.id);
        if (alreadyRequested) return;

        try {
          const newRequest = await Api.sendRequest(service);
          setMyRequests((prev) => [...prev, newRequest]);
        } catch (error) {
          alert('Could not send your request. Please try again.');
        }
      };

      const handleApproveRequest = async (id) => {
        try {
          const updated = await Api.updateRequestStatus(id, 'active');
          setMyRequests((prev) => prev.map((req) => (req.id === id ? updated : req)));
        } catch (error) {
          alert('Could not update this request. Please try again.');
        }
      };

      const handleEndRequest = async (id) => {
        try {
          await Api.endRequest(id);
          setMyRequests((prev) => prev.filter((req) => req.id !== id));
        } catch (error) {
          alert('Could not update this request. Please try again.');
        }
      };

      // THE FIX: Single loading gate for the whole page. currentUser being null AND isLoadingPage being true
      // covers the exact same case your old "if (!currentUser)" check did, just now driven by a real async fetch
      if (isLoadingPage || !currentUser) {
        return (
          <div className="layout-wrapper">
            <p style={{ color: '#94a3b8' }}>Loading your workspace...</p>
          </div>
        );
      }

      const firstName = currentUser.googleName ? currentUser.googleName.split(' ')[0] : 'there';
      const roleLabel = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);

      return (
        <div className="home-page-wrapper">

          <nav className="navbar">
            <div className="nav-logo">Get<span>it</span></div>
            <div className="nav-links">
              <button className="nav-icon-btn" title="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#94a3b8"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              </button>
              <button className="nav-icon-btn" title="Messages">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#94a3b8"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
              </button>
              <button className="nav-icon-btn" title="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#94a3b8"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
              </button>
              <div className="nav-avatar">
                {currentUser.googlePicture
                  ? <img src={currentUser.googlePicture} alt={firstName} className="nav-avatar-img" />
                  : <span>{firstName.charAt(0)}</span>}
              </div>
            </div>
          </nav>

          <main className="home-content">

            <div className="home-header">
              <div>
                <h1 className="home-greeting">Welcome back, {firstName}</h1>
                <p className="home-subgreeting">Here's what's happening near you today.</p>
              </div>
              <span className="role-badge">{roleLabel}</span>
            </div>

            <div className="stats-glass-panel">
              {currentUser.role === 'buyer' && (
                <>
                  <div className="stat-item"><span className="stat-number">3</span><span className="stat-label">Active Requests</span></div>
                  <div className="stat-item"><span className="stat-number">12</span><span className="stat-label">Completed Jobs</span></div>
                  <div className="stat-item"><span className="stat-number">4.8</span><span className="stat-label">Avg. Rating Given</span></div>
                </>
              )}
              {currentUser.role === 'seller' && (
                <>
                  <div className="stat-item"><span className="stat-number">3</span><span className="stat-label">Active Listings</span></div>
                  <div className="stat-item"><span className="stat-number">263</span><span className="stat-label">Total Views</span></div>
                </>
              )}
              {currentUser.role === 'courier' && (
                <>
                  <div className="stat-item"><span className="stat-number">3</span><span className="stat-label">Available Jobs</span></div>
                  <div className="stat-item"><span className="stat-number">27</span><span className="stat-label">Deliveries Done</span></div>
                  <div className="stat-item"><span className="stat-number">4.9</span><span className="stat-label">Courier Rating</span></div>
                </>
              )}
            </div>

            {currentUser.role === 'buyer' && (
              <>
                <div className="section-header">
                  <h2 className="section-title">Nearby Services</h2>
                  <button className="post-request-btn">+ Post a Request</button>
                </div>
                <div className="service-grid">
                  {nearbyServices.map((service) => (
                    <div className="service-card" key={service.id}>
                      <div className="service-card-icon">{service.icon}</div>
                      <h3 className="service-card-title">{service.category}</h3>
                      <p className="service-card-provider">{service.providerName}</p>
                      <div className="service-card-meta">
                        <span className="service-rating">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="#eab308" style={{marginRight: '4px', verticalAlign: 'text-bottom'}}><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                          {service.rating}
                        </span>
                        <span className="service-distance">{service.distance}</span>
                      </div>
                      <div className="service-card-footer">
                        <span className="service-price">{service.price}</span>
                        <button
                          className="request-btn"
                          disabled={myRequests.some((req) => req.sourceId === service.id)}
                          onClick={() => handleSendRequest(service)}
                        >
                          {myRequests.some((req) => req.sourceId === service.id) ? 'Requested' : 'Request'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {myRequests.length > 0 && (
                  <>
                    <div className="section-header">
                      <h2 className="section-title">My Requests</h2>
                    </div>
                    <div className="listing-list">
                      {myRequests.map((req) => (
                        <div className="listing-row" key={req.id}>
                          <div className="listing-row-main">
                            <h3 className="listing-title">{req.title}</h3>
                            <p className="listing-meta">{req.provider}</p>
                          </div>
                          <span className={`status-pill ${req.status === 'active' ? 'status-active' : 'status-waiting'}`}>
                            {req.status === 'active' ? 'Active' : 'Waiting'}
                          </span>
                          {req.status === 'waiting' ? (
                            <>
                              <button className="request-btn" onClick={() => handleApproveRequest(req.id)}>Simulate Approval</button>
                              <button className="cancel-btn" onClick={() => handleEndRequest(req.id)}>Cancel</button>
                            </>
                          ) : (
                            <button className="request-btn" onClick={() => handleEndRequest(req.id)}>Mark Complete</button>
                          )}
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </>
            )}

            {currentUser.role === 'seller' && (
              <>
                <div className="section-header">
                  <h2 className="section-title">Your Listings</h2>
                  <button className="post-request-btn">+ Add Listing</button>
                </div>
                <div className="listing-list">
                  {listings.map((listing) => (
                    <div className="listing-row" key={listing.id}>
                      {editingListingId === listing.id ? (
                        <>
                          <div className="listing-row-main">
                            <input
                              type="text"
                              className="custom-input edit-input"
                              value={editDraft.title}
                              onChange={(e) => setEditDraft((prev) => ({ ...prev, title: e.target.value }))}
                            />
                            <input
                              type="text"
                              list="classification-options"
                              className="custom-input edit-input"
                              placeholder="Search classification..."
                              value={editDraft.classification}
                              onChange={(e) => setEditDraft((prev) => ({ ...prev, classification: e.target.value }))}
                            />
                            <datalist id="classification-options">
                              {ALL_CLASSIFICATIONS.map((option) => (
                                <option value={option} key={option} />
                              ))}
                            </datalist>
                          </div>
                          <button className="request-btn" onClick={() => handleSaveEdit(listing.id)}>Save</button>
                          <button className="cancel-btn" onClick={handleCancelEdit}>Cancel</button>
                        </>
                      ) : (
                        <>
                          <div className="listing-row-main">
                            <h3 className="listing-title">{listing.title}</h3>
                            <p className="listing-meta">{listing.classification} · {listing.views} views</p>
                          </div>
                          <span className={`status-pill ${listing.status === 'Active' ? 'status-active' : 'status-paused'}`}>
                            {listing.status}
                          </span>
                          <span className="listing-price">{listing.price}</span>
                          <button className="edit-btn" onClick={() => handleStartEdit(listing)} title="Edit">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
                          </button>
                          <button className="delete-btn" onClick={() => handleDeleteListing(listing.id)} title="Delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                          </button>
                        </>
                      )}
                    </div>
                  ))}
                </div>

                <div className="section-header">
                  <h2 className="section-title">Requests Matching Your Categories</h2>
                </div>
                <div className="listing-list">
                  {matchingRequests.map((req) => (
                    <div className="listing-row" key={req.id}>
                      <div className="listing-row-main">
                        <h3 className="listing-title">{req.title}</h3>
                        <p className="listing-meta">{req.classification} · Posted by {req.postedBy}</p>
                      </div>
                      <span className="listing-price">{req.budget}</span>
                      <button className="request-btn">Offer to Help</button>
                    </div>
                  ))}
                </div>
              </>
            )}

            {currentUser.role === 'courier' && (
              <>
                <div className="section-header">
                  <h2 className="section-title">Available Deliveries</h2>
                </div>
                <div className="listing-list">
                  {deliveries.map((job) => (
                    <div className="listing-row" key={job.id}>
                      <div className="listing-row-main">
                        <h3 className="listing-title">{job.pickup} → {job.dropoff}</h3>
                        <p className="listing-meta">{job.distance}</p>
                      </div>
                      <span className="status-pill status-active">{job.status}</span>
                      <span className="listing-price">{job.fee}</span>
                    </div>
                  ))}
                </div>
              </>
            )}

            <div className="section-header">
              <h2 className="section-title">Recent Notifications</h2>
            </div>
            <div className="notification-list">
              {notifications.map((note) => (
                <div className="notification-row" key={note.id}>
                  <p className="notification-text">{note.text}</p>
                  <span className="notification-time">{note.time}</span>
                </div>
              ))}
            </div>

            <button onClick={handleLogout} className="logout-btn">Secure Log Out</button>

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
