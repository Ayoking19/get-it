<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get It - Notifications</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = 'https://ayomikun.alwaysdata.net/api';

    const NotificationsPage = () => {
      const [notifications, setNotifications] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      // THE FIX: This reuses the EXACT SAME /api/notifications endpoint home.html already calls — the only
      // difference is this page shows the FULL history instead of home.html's short preview list
      useEffect(() => {
        fetch(`${API_BASE}/notifications`, { credentials: 'include' })
          .then((res) => {
            if (!res.ok) throw new Error('Not logged in');
            return res.json();
          })
          .then((data) => setNotifications(data))
          .catch(() => { window.location.href = "index.html"; })
          .finally(() => setIsLoading(false));
      }, []);

      return (
        <div className="home-page-wrapper">
          <nav className="navbar">
            <div className="nav-logo">Get<span>it</span></div>
          </nav>
          <main className="home-content">
            <a href="home.html" className="page-back-link">← Back to dashboard</a>
            <h1 className="home-greeting">Notifications</h1>
            {isLoading ? (
              <p className="empty-state">Loading...</p>
            ) : notifications.length === 0 ? (
              <p className="empty-state">You have no notifications yet.</p>
            ) : (
              <div className="notification-list" style={{ marginTop: '20px' }}>
                {notifications.map((note) => (
                  <div className="notification-row" key={note.id}>
                    <p className="notification-text">{note.text}</p>
                    <span className="notification-time">{note.time}</span>
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<NotificationsPage />);
  </script>
</body>
</html>
