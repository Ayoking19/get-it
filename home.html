<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get It - Dashboard</title>
  
  <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Dashboard = () => {
      // THE FIX: currentUser holds the logged-in user's record, read from Local Storage on page load, or null if nobody is logged in
      const [currentUser, setCurrentUser] = useState(null);

      // THE FIX: This useEffect acts as a route guard. It runs once when the page first loads, checks Local Storage for an
      // active session, and if none exists, sends the visitor straight back to the login page instead of letting them view
      // the dashboard directly by typing home.html into the address bar
      useEffect(() => {
        const storedUser = localStorage.getItem('currentUser');

        if (!storedUser) {
          window.location.href = "index.html";
          return;
        }

        // THE FIX: JSON.parse converts the stored text string back into a real JavaScript object we can read properties from
        setCurrentUser(JSON.parse(storedUser));
      }, []);

      // THE FIX: handleLogout now actually ends the session instead of just changing the page
      const handleLogout = () => {
        // THE FIX: Removes only the ACTIVE session, not the permanent "registered_<role>" record — the user is signed out
        // right now, but next time they log in with the same role, they still skip the onboarding form
        localStorage.removeItem('currentUser');
        window.location.href = "index.html";
      };

      return (
        <div className="layout-wrapper">
          {/* We reuse the auth-card class but widen it to look more like a standard software dashboard */}
          <div className="auth-card" style={{ maxWidth: '800px' }}>
            
                        <div className="card-header">
              <h1 className="brand-title">Get<span>it</span> Workspace</h1>
              {/* THE FIX: Greets the real signed-in user by name instead of a generic subtitle, once currentUser has loaded */}
              <p className="brand-subtitle">
                {currentUser ? `Welcome back, ${currentUser.googleName.split(' ')[0]}.` : 'Loading your workspace...'}
              </p>
            </div>
            
            <div style={{ color: 'white', textAlign: 'left', margin: '40px 0', padding: '20px', background: 'rgba(0,0,0,0.2)', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.08)' }}>
              <h3 style={{ marginBottom: '10px', color: '#fb923c' }}>
                {/* THE FIX: Shows the real role the user selected (Buyer / Seller / Courier) instead of a static heading */}
                {currentUser ? `Signed in as ${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)}` : 'Authentication Successful'}
              </h3>
              <p style={{ fontSize: '14px', lineHeight: '1.6', color: '#94a3b8' }}>
                {currentUser
                  ? `Hey ${currentUser.fullName || currentUser.googleName}, your profile data has been saved locally. In the future, we will use React State to dynamically inject the ${currentUser.role} interface right here.`
                  : 'Your profile data has been processed. In the future, we will use React State to dynamically inject the Buyer, Seller, or Courier interface right here based on the role you selected during login.'}
              </p>
            </div>

            <button onClick={handleLogout} className="google-sso-btn continue-btn">
              <span className="primary-text" style={{ color: 'white', textAlign: 'center', width: '100%' }}>Secure Log Out</span>
            </button>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
