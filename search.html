<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get It - Search</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = 'https://ayomikun.alwaysdata.net/api';

    const ALL_CLASSIFICATIONS = [
      'Furniture', 'Mechanical Engineering', 'Electrical Engineering', 'Cook', 'Plumbing',
      'Entertainment', 'Electronic Devices', 'Health Expert', 'Gym', 'Graphic Design',
      'Web Development', 'Photography', 'Tutoring', 'Event Planning', 'Beauty & Salon',
      'Auto Repair', 'Tailoring', 'Cleaning Services', 'Painting', 'Food', 'Clothing',
      'Electronics', 'Cars', 'Houses', 'Watches', 'Cooking Utensils', 'Transport',
      'Books', 'Jewelry', 'Sports Equipment', 'Beauty Products', 'Toys', 'Appliances'
    ].sort();

    const SearchPage = () => {
      const [allServices, setAllServices] = useState([]);
      const [keyword, setKeyword] = useState('');
      const [classification, setClassification] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      // THE FIX: Fetches once with no classification filter (server.js's ?classification= param is optional),
      // then keyword + classification filtering both happen instantly client-side against that same result set —
      // no extra network round-trip needed just to filter by typed text
      useEffect(() => {
        fetch(`${API_BASE}/services`, { credentials: 'include' })
          .then((res) => {
            if (!res.ok) throw new Error('Not logged in');
            return res.json();
          })
          .then((data) => setAllServices(data))
          .catch(() => { window.location.href = "index.html"; })
          .finally(() => setIsLoading(false));
      }, []);

      const filteredServices = allServices.filter((service) => {
        const matchesKeyword = (service.title || '').toLowerCase().includes(keyword.toLowerCase());
        const matchesClassification = !classification || service.classification === classification;
        return matchesKeyword && matchesClassification;
      });

      return (
        <div className="home-page-wrapper">
          <nav className="navbar">
            <div className="nav-logo">Get<span>it</span></div>
          </nav>
          <main className="home-content">
            <a href="home.html" className="page-back-link">← Back to dashboard</a>
            <h1 className="home-greeting">Search</h1>
            <div style={{ display: 'flex', gap: '12px', margin: '20px 0', flexWrap: 'wrap' }}>
              <input
                type="text"
                className="custom-input"
                style={{ flex: 2, minWidth: '200px' }}
                placeholder="Search by title..."
                value={keyword}
                onChange={(e) => setKeyword(e.target.value)}
              />
              <select
                className="custom-input"
                style={{ flex: 1, minWidth: '160px' }}
                value={classification}
                onChange={(e) => setClassification(e.target.value)}
              >
                <option value="">All categories</option>
                {ALL_CLASSIFICATIONS.map((c) => <option value={c} key={c}>{c}</option>)}
              </select>
            </div>

            {isLoading ? (
              <p className="empty-state">Loading...</p>
            ) : filteredServices.length === 0 ? (
              <p className="empty-state">No matching services found.</p>
            ) : (
              <div className="service-grid">
                {filteredServices.map((service) => (
                  <div className="service-card" key={service.id}>
                    <h3 className="service-card-title">{service.title || service.classification}</h3>
                    <p className="service-card-provider">{service.providerName}</p>
                    <div className="service-card-footer">
                      <span className="service-price">{service.price}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<SearchPage />);
  </script>
</body>
</html>
