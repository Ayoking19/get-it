<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get It - My Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const CustomAlert = ({ isOpen, title, message, type, onClose, onConfirm }) => {
      if (!isOpen) return null;
      return (
        <div className="alert-overlay">
          <div className="alert-card">
            <div className={`alert-icon ${type}`}>
              {type === 'success' ? (
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              ) : type === 'confirm' ? (
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              ) : (
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              )}
            </div>
            <h3 className="alert-title">{title}</h3>
            <p className="alert-message">{message}</p>
            
            {type === 'confirm' ? (
              <div style={{ display: 'flex', gap: '12px' }}>
                <button className="alert-btn error" style={{ flex: 1 }} onClick={onClose}>No</button>
                <button className="alert-btn success" style={{ flex: 1 }} onClick={() => { onClose(); if (onConfirm) onConfirm(); }}>Yes</button>
              </div>
            ) : (
              <button className={`alert-btn ${type}`} onClick={() => { onClose(); if (onConfirm) onConfirm(); }}>
                {type === 'success' ? 'Continue' : 'Dismiss'}
              </button>
            )}
          </div>
        </div>
      );
    };

    const ProfilePage = () => {
      const [formData, setFormData] = useState({
        username: '',
        fullName: '',
        phone: '',
        role: ''
      });
      const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'error', onConfirm: null });

      const showAlert = (title, message, type = 'error', onConfirm = null) => {
        setAlertConfig({ isOpen: true, title, message, type, onConfirm });
      };

      useEffect(() => {
        // THE FIX: Pulls the active user from localStorage to populate the form instantly.
        // Once the backend is ready, this will be replaced with a GET /api/me fetch call.
        const storedUser = JSON.parse(localStorage.getItem('currentUser'));
        if (storedUser) {
          setFormData({
            username: storedUser.username || '',
            fullName: storedUser.fullName || storedUser.full_name || '',
            phone: storedUser.phone || '',
            role: storedUser.role ? storedUser.role.charAt(0).toUpperCase() + storedUser.role.slice(1) : ''
          });
        }
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        // THE FIX: Saves changes to localStorage so the UI updates globally. 
        // Backend team will swap this for a PUT /api/users/profile call later.
        const storedUser = JSON.parse(localStorage.getItem('currentUser')) || {};
        const updatedUser = { ...storedUser, ...formData, full_name: formData.fullName };
        localStorage.setItem('currentUser', JSON.stringify(updatedUser));
        
        showAlert('Profile Updated', 'Your account details have been successfully saved.', 'success');
      };

      return (
        <div className="layout-wrapper">
          <div className="auth-card">
            <a href="home.html" className="page-back-link">← Back to dashboard</a>
            <div className="card-header">
              <h1 className="brand-title">My <span>Profile</span></h1>
              <p className="brand-subtitle">Manage your personal information.</p>
            </div>
            
            <form onSubmit={handleSubmit} className="onboarding-form">
              <div className="input-group">
                <label>Account Role (Read Only)</label>
                <input type="text" className="custom-input" value={formData.role} disabled style={{ opacity: 0.6 }} />
              </div>

              <div className="input-group">
                <label>Full Name</label>
                <input type="text" name="fullName" required className="custom-input" value={formData.fullName} onChange={handleChange} />
              </div>

              <div className="input-group">
                <label>Username</label>
                <input type="text" name="username" required className="custom-input" value={formData.username} onChange={handleChange} />
              </div>
              
              <div className="input-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required className="custom-input" value={formData.phone} onChange={handleChange} />
              </div>

              <button type="submit" className="google-sso-btn continue-btn">
                <span className="primary-text" style={{ color: 'white', textAlign: 'center', width: '100%' }}>Save Changes</span>
              </button>
            </form>
          </div>
          <CustomAlert {...alertConfig} onClose={() => setAlertConfig({ ...alertConfig, isOpen: false })} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<ProfilePage />);
  </script>
</body>
</html>
